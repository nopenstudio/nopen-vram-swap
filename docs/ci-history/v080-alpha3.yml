name: v0.8 alpha.3 2GiB GPU-only safety and offline regression
on:
  push:
    branches: ["develop/v0.8.0-alpha.3"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: All CTest regressions + 2GiB mock tags/guard (NO GPU SWAP)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU/mock test suite
        run: |
          cmake -S v080 -B build-v080 -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=OFF
          cmake --build build-v080 --parallel
          ctest --test-dir build-v080 --output-on-failure
          bash -n v080/tools/run_alpha3_gpu.sh
          python3 -m py_compile v080/tests/test_alpha3_guard.py
          python3 -m py_compile v080/tools/capacity_plan.py
      - name: Enforce unchanged physical kernel-SWAP limit
        run: |
          python3 v070/tests/test_swap_policy.py v070/tools/vram_swap_lab.sh
          grep -F 'max_capacity_mib=64' v070/tools/vram_swap_lab.sh
  opencl-compile:
    name: Compile AMD OpenCL path without physical GPU execution
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL loader and headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
      - name: Compile all real GPU paths with strict warnings
        run: |
          cmake -S v080 -B build-opencl -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=ON
          cmake --build build-opencl --parallel
          echo "V080_ALPHA3_OPENCL_BUILD_PASS real_gpu_executed=NO kernel_swap=NO"
  offline-2gib:
    name: 2GiB mock + real durable SSD shadow (NO GPU SWAP)
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S v080 -B build-v080 -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=OFF
          cmake --build build-v080 --parallel
          ./build-v080/nopen-v080-scale \
            "$GITHUB_WORKSPACE/build-v080/v070/v060/nopen-isolated-worker" \
            "$RUNNER_TEMP/v080-alpha3-2gib-shadow.bin" 2048
