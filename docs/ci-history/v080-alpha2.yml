name: v0.8 alpha.2 OpenCL data path opt-in and GPU-free regression
on:
  push:
    branches: ["develop/v0.8.0-alpha.2"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-regression:
    name: Full inherited regressions + alpha.2 mock 4KiB..4MiB
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and test CPU/mock; no GPU, no kernel swap
        run: |
          cmake -S v080 -B build-v080 -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=OFF
          cmake --build build-v080 --parallel
          ctest --test-dir build-v080 --output-on-failure
          bash -n v070/tools/vram_swap_lab.sh
          bash -n v080/tools/run_alpha2_gpu.sh
          python3 -m py_compile v080/tools/compare_gpu_paths.py
          python3 -m py_compile v080/tests/test_gpu_compare.py
          python3 v080/tests/test_capacity_plan.py
          python3 v080/tests/test_opencl_optimization.py
      - name: Prove production physical SWAP gate remains unchanged
        run: |
          python3 v070/tests/test_swap_policy.py v070/tools/vram_swap_lab.sh
          grep -F 'max_capacity_mib=64' v070/tools/vram_swap_lab.sh
  opencl-compile:
    name: Compile real OpenCL pinned DMA path without GPU execution
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCL headers/loader
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers
      - name: Compile real AMD path with strict warnings (no kernel swap)
        run: |
          cmake -S v080 -B build-opencl -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=ON
          cmake --build build-opencl --parallel
          # CI has no discrete AMD GPU; the real OpenCL execution step must
          # be done explicitly on the user's GPU, never a CPU OpenCL fallback.
          echo "V080_ALPHA2_OPENCL_BUILD_PASS real_gpu_execution=NO"
  staged-offline-1gib:
    name: Recheck 1GiB mock+real SSD after alpha.2 changes
    needs: build-regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S v080 -B build-v080 -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=OFF
          cmake --build build-v080 --parallel
          ./build-v080/nopen-v080-scale \
            "$GITHUB_WORKSPACE/build-v080/v070/v060/nopen-isolated-worker" \
            "$RUNNER_TEMP/v080-alpha2-1gib-shadow.bin" 1024
  staged-offline-2gib:
    name: Recheck 2GiB mock+real SSD only after 1GiB
    needs: staged-offline-1gib
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S v080 -B build-v080 -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=OFF
          cmake --build build-v080 --parallel
          ./build-v080/nopen-v080-scale \
            "$GITHUB_WORKSPACE/build-v080/v070/v060/nopen-isolated-worker" \
            "$RUNNER_TEMP/v080-alpha2-2gib-shadow.bin" 2048
  staged-offline-4gib:
    name: Recheck 4GiB mock+real SSD only after 2GiB
    needs: staged-offline-2gib
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S v080 -B build-v080 -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=OFF
          cmake --build build-v080 --parallel
          ./build-v080/nopen-v080-scale \
            "$GITHUB_WORKSPACE/build-v080/v070/v060/nopen-isolated-worker" \
            "$RUNNER_TEMP/v080-alpha2-4gib-shadow.bin" 4096
