name: Issue 10: trace-only mock regression (never kernel SWAP)

on:
  push:
    branches:
      - diagnostics/issue-10-io-trace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-ipc-phase-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure mock-only backend
        run: cmake -S v060 -B build-issue10 -DCMAKE_BUILD_TYPE=Debug -DNOPEN_OPENCL=OFF
      - name: Compile tracing and test binaries
        run: cmake --build build-issue10 --parallel 2
      - name: Validate trace BEGIN/END, GPU worker phases and injected timeout
        run: ctest --test-dir build-issue10 -R v060_issue10_trace_mock_only --output-on-failure
      - name: Confirm no kernel SWAP commands in diagnostic test
        run: |
          ! grep -En '(^|[^a-z])swapon([[:space:]]|\()|(^|[^a-z])swapoff([[:space:]]|\()|mkswap|modprobe|/dev/ublk' v060/tests/test_issue10_ipc_trace.py
          echo ISSUE10_MOCK_TRACE_CI_PASS gpu_context=NO kernel_swap=NO zram=UNMODIFIED
