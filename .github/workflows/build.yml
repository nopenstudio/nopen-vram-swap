name: "Nopen public landing | docs-only checks"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate public documentation and safety links
        run: python3 tests/main_landing_contract.py
      - name: No legacy backend or kernel swap execution
        run: echo 'MAIN_DOCS_ONLY_PASS vulkan_not_built=YES kernel_swap=BLOCKED'
