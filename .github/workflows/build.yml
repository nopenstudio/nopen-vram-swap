name: "Nopen OpenCL | crash-stabilization mock CI"

on:
  push:
    branches: [main, 'develop/**', 'fix/**', 'chore/**', 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure root mock-only OpenCL OFF
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNOPEN_OPENCL=OFF
      - name: Build CPU/mock targets only
        run: cmake --build build --parallel 2
      - name: Run canonical reliability, IPC and safety regressions
        run: ctest --test-dir build -R '^(repository_|v060_isolated_gpu_process_deadline_and_ipc_checksum|v060_issue10_trace_mock_only|v070_fatal_gpu_ipc_forensic_log|v083_|v084_|v085_)' --output-on-failure
      - name: Verify read-only AMDGPU preflight/observer safety contract
        run: python3 v085/tests/test_v085_safety_contract.py
      - name: Confirm no GPU or kernel swap test is started in CI
        run: echo 'MOCK_ONLY_CI_PASS opencl_off=YES vulkan_archive_not_built=YES kernel_swap=BLOCKED'
