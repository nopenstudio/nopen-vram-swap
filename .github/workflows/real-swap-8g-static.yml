name: 8 GiB VRAM swap experimental profile — static validation
on:
  push:
    branches:
      - experiments/real-swap-8g
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenCL headers and compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ocl-icd-opencl-dev opencl-headers gcc make
      - name: Extract isolated 8 GiB profile without enabling swap
        run: |
          python3 experiments/real-swap-8g/build-profile.py \
            --archive legacy/archives/Nopen_VRAM_NBD_v0.9.3_NBD_Stall_Diagnostics.zip \
            --output /tmp/nopen-8g-compiled
      - name: Static validation and offline unit tests (never use NBD device)
        run: |
          bash -n experiments/real-swap-8g/real-swap-8g.sh
          python3 -m py_compile experiments/real-swap-8g/build-profile.py
          make -C /tmp/nopen-8g-compiled -j2
          make -C /tmp/nopen-8g-compiled test
          grep -q 'mb != 8192' /tmp/nopen-8g-compiled/nopen-vram-nbd.c
          grep -q 'NBD_SET_SIZE_BLOCKS' /tmp/nopen-8g-compiled/nopen-vram-nbd.c
          for script in start-v093.sh enable-v093.sh disable-v093.sh monitor-v093.sh \
                        doctor-v093.sh focus-probe-v093.sh run-isolated-cycle.sh \
                        collect-after-reboot.sh; do
            test -x "/tmp/nopen-8g-compiled/$script"
          done