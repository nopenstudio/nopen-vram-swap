name: v0.7 experimental Linux GPU swap proof
on:
  push:
    branches: ["develop/v0.7.0"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile complete inherited Nopen stack (mock)
        run: |
          cmake -S v070 -B build-v070-test -DCMAKE_BUILD_TYPE=Release -DNOPEN_OPENCL=OFF
          cmake --build build-v070-test --parallel
          ctest --test-dir build-v070-test --output-on-failure
          bash -n v070/tools/vram_swap_lab.sh
          bash -n v070/tools/test_swap_vm.sh
          bash -n v070/tools/build_ublk.sh
          bash -n v070/tools/test_service_vm.sh
      - name: Confirm no unconsented swap or zram modification
        run: |
          python3 v070/tests/test_swap_policy.py v070/tools/vram_swap_lab.sh
  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run inherited CPU/mock regression with sanitizers
        run: |
          cmake -S v070 -B build-v070-san -DCMAKE_BUILD_TYPE=Debug -DNOPEN_OPENCL=OFF \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-v070-san --parallel
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
            ctest --test-dir build-v070-san --output-on-failure
  kernel-swap-mock-disposable-vm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check kernel ublk support and install development requirements
        id: ublk
        run: |
          if [[ -c /dev/ublk-control ]] || sudo modprobe ublk_drv; then
            if [[ -c /dev/ublk-control ]]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "V070_KERNEL_UBLK_PRESENT=YES"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "V070_KERNEL_SWAP_UNVERIFIED missing_control_device=YES"
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "V070_KERNEL_SWAP_UNVERIFIED missing_driver=YES"
          fi
      - name: Install pinned libublksrv and full OpenCL development toolchain
        if: steps.ublk.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config g++ cmake \
            liburing-dev ocl-icd-opencl-dev opencl-headers util-linux
          bash v070/tools/build_ublk.sh
      - name: Root systemd service cgroup outlives user login lifecycle
        if: steps.ublk.outputs.available == 'true'
        timeout-minutes: 3
        run: |
          bash -n v070/tools/test_service_vm.sh
          if [[ -d /run/systemd/system ]]; then
            sudo env GITHUB_ACTIONS=true NOPEN_ISOLATED_VM_TEST=I_ACKNOWLEDGE_DISPOSABLE_VM \
              bash v070/tools/test_service_vm.sh \
              "$GITHUB_WORKSPACE/build-v070/nopen-v070-ublk" \
              "$GITHUB_WORKSPACE/build-v070/ublksrv-upstream/ublk" \
              "$GITHUB_WORKSPACE/build-v070/v060/nopen-isolated-worker"
          else
            echo "SYSTEM_UNIT_VM_UNAVAILABLE no_systemd_init=YES"
          fi
      - name: Actual disposable Linux ublk kernel swap activation + teardown
        if: steps.ublk.outputs.available == 'true'
        timeout-minutes: 4
        run: |
          sudo env GITHUB_ACTIONS=true NOPEN_ISOLATED_VM_TEST=I_ACKNOWLEDGE_DISPOSABLE_VM \
            bash v070/tools/test_swap_vm.sh \
            "$GITHUB_WORKSPACE/build-v070/nopen-v070-ublk" \
            "$GITHUB_WORKSPACE/build-v070/ublksrv-upstream/ublk" \
            "$GITHUB_WORKSPACE/build-v070/v060/nopen-isolated-worker"
